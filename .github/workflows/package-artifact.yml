name: Private Tick package artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run proof:smoke
      - run: npm run proof:build
      - run: npm run proof:kv:build
      - run: npm run proof:trigger:build
      - run: npm run proof:s3:build
      - run: npm run monitor:guest:build
      - run: npm run package:artifact -- --output pkg/private-preview
      - uses: actions/upload-artifact@v4
        with:
          name: tick-private-preview-${{ github.sha }}
          path: pkg/private-preview/*
          if-no-files-found: error
          retention-days: 30
