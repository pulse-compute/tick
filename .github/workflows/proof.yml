name: Tick contracts and proof
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run proof:smoke
      - run: npm run proof:build
      - run: npm run proof:kv:build
      - run: npm run proof:trigger:build
      - run: npm run proof:s3:build
