manifest_version = 3
name = "tick-02-kv-proof"
description = "Bounded conditional KV proof; no scheduler or application effects"
language = "javascript"

[scripts]
build = "npm --prefix ../.. run proof:kv:build"

[local_server.backends.fastly_api]
url = "https://api.fastly.com"

[[local_server.secret_stores.tick02_secrets]]
key = "probe-token"
env = "TICK_PROBE_TOKEN"
[[local_server.secret_stores.tick02_secrets]]
key = "fastly-api-token"
env = "TICK02_FASTLY_API_TOKEN"

[setup.backends.fastly_api]
address = "api.fastly.com"
port = 443
description = "KV HTTP API; verify TLS, hostname and timeouts per README before activation"

[setup.secret_stores.tick02_secrets]
[setup.secret_stores.tick02_secrets.entries.probe-token]
description = "Dedicated 32-256 character base64url proof token"
[setup.secret_stores.tick02_secrets.entries.fastly-api-token]
description = "Dedicated scoped Fastly API token for proof KV operations"
